name: Build & Push LNDK Docker Image

on:
  push:
    branches: [main]
    paths:
      - "lndk/Dockerfile"
      - "lndk/startup.sh"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (ARM64 cross-compile)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/silexperience210/lndk
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # Built from lndk master commit e0b2344, not a tagged release.
            # PR #253 (amountless offers) is not in any release yet; retag
            # to the release version once one ships that contains it.
            type=raw,value=master-e0b2344
            type=sha,prefix=sha-

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./lndk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
