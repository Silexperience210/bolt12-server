  <rect x="632" y="382" width="616" height="306" rx="18" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="652" y="412" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#f0f0ff">Offers actives</text>
  <rect x="1180" y="395" width="28" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="1194" y="411" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">3</text>

