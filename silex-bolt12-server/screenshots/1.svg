  <text x="672" y="472" font-family="monospace" font-size="10" fill="rgba(196,181,253,0.5)">lno1qgsyxjtl6luzd9t3pr62xr7eemp6awnejusgd97ek8w...</text>
  <text x="672" y="490" font-family="-apple-system,sans-serif" font-size="11" fill="#6b6b8a"># a3f2b91c · il y a 2 heures</text>
  <text x="1178" y="460" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#f59e0b" text-anchor="end">5,000</text>
  <text x="1178" y="475" font-family="-apple-system,sans-serif" font-size="10" fill="#6b6b8a" text-anchor="end">sats</text>

  <!-- Row 2 -->
  <rect x="652" y="510" width="576" height="72" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="672" y="534" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f0ff">Support développement</text>
  <text x="672" y="554" font-family="monospace" font-size="10" fill="rgba(196,181,253,0.5)">lno1qgsyxjtl6luzd9t3pr62xr7eemp6awnejusgd97...</text>
  <text x="672" y="572" font-family="-apple-system,sans-serif" font-size="11" fill="#6b6b8a"># 7d9e4f2a · il y a 1 jour</text>
  <text x="1178" y="542" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#c4b5fd" text-anchor="end">∞</text>
  <text x="1178" y="557" font-family="-apple-system,sans-serif" font-size="10" fill="#6b6b8a" text-anchor="end">libre</text>

  <!-- Row 3 -->
  <rect x="652" y="592" width="576" height="72" rx="12" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="672" y="616" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f0ff">Café ⚡</text>
  <text x="672" y="636" font-family="monospace" font-size="10" fill="rgba(196,181,253,0.5)">lno1qgsyxjtl6luzd9t3pr62xr7eemp6awnejusgd9...</text>
  <text x="672" y="654" font-family="-apple-system,sans-serif" font-size="11" fill="#6b6b8a"># 2b8c5e1f · il y a 3 jours</text>
  <text x="1178" y="624" font-family="-apple-system,sans-serif" font-size="16" font-weight="800" fill="#f59e0b" text-anchor="end">1,000</text>
  <text x="1178" y="639" font-family="-apple-system,sans-serif" font-size="10" fill="#6b6b8a" text-anchor="end">sats</text>

  <!-- Footer bar -->
