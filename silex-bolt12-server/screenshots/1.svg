  <text x="690" y="344" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#6b6b8a" text-anchor="middle">📊 Statistiques</text>
  <text x="870" y="344" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#6b6b8a" text-anchor="middle">🧾 Templates</text>
