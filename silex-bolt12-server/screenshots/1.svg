    <text x="38" y="23" font-family="-apple-system,sans-serif" font-size="12" fill="#f0f0ff">LND <tspan font-weight="600">connecté</tspan></text>

    <!-- LNDK pill -->
    <rect x="172" y="0" width="175" height="36" rx="18" fill="rgba(16,185,129,0.05)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="196" cy="18" r="5" fill="#10b981"/>
    <text x="210" y="23" font-family="-apple-system,sans-serif" font-size="12" fill="#f0f0ff">LNDK <tspan font-weight="600">prêt</tspan></text>

