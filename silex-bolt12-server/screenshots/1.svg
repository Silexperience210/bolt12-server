  <rect x="184" y="565" width="130" height="32" rx="8" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="249" y="586" font-family="-apple-system,sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">⚡ 5000 sats</text>
  <rect x="326" y="565" width="140" height="32" rx="8" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="396" y="586" font-family="-apple-system,sans-serif" font-size="12" fill="#c4b5fd" text-anchor="middle">🎯 Montant libre</text>

