<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="100%" style="stop-color:#0a0520"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.07)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0a4e"/>
      <stop offset="100%" style="stop-color:#0d0628"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:rgba(139,92,246,0.18)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="40%">
      <stop offset="0%" style="stop-color:rgba(245,158,11,0.09)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="200" cy="150" rx="400" ry="300" fill="rgba(139,92,246,0.13)" filter="url(#blur1)"/>
  <ellipse cx="1100" cy="600" rx="350" ry="250" fill="rgba(245,158,11,0.08)" filter="url(#blur1)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1280" height="80" fill="rgba(5,5,16,0.8)"/>
  <rect x="0" y="79" width="1280" height="1" fill="rgba(139,92,246,0.18)"/>

  <!-- Logo icon -->
  <rect x="32" y="18" width="44" height="44" rx="12" fill="url(#logoGrad)" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
  <!-- Lightning bolt in logo -->
  <polygon points="56,28 48,44 54,44 46,60 62,42 56,42 62,28" fill="#f59e0b"/>

  <!-- Logo text -->
  <text x="86" y="37" font-family="-apple-system,sans-serif" font-size="17" font-weight="800" fill="url(#accent)">BOLT12 Server</text>
  <text x="86" y="53" font-family="-apple-system,sans-serif" font-size="11" fill="#6b6b8a">Lightning Node Dashboard</text>

  <!-- Version badge -->
  <rect x="1140" y="26" width="60" height="22" rx="11" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="1170" y="41" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">v2.0.0</text>

  <!-- Lock button -->
