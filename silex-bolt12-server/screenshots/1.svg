  <rect x="32" y="160" width="390" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="52" y="192" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#6b6b8a" letter-spacing="1">⚡ LIGHTNING LOCAL</text>
  <text x="52" y="240" font-family="-apple-system,sans-serif" font-size="32" font-weight="800" fill="#c4b5fd">125,000</text>
  <text x="190" y="240" font-family="-apple-system,sans-serif" font-size="16" font-weight="500" fill="#6b6b8a"> sats</text>
  <text x="52" y="270" font-family="-apple-system,sans-serif" font-size="11" fill="#6b6b8a">Remote: 340,000 sats</text>

