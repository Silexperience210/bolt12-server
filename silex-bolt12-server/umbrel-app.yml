releaseNotes: >-
  v2.2.2 — Bug fixes

  - Fix: creating an offer with a fixed amount no longer returns an error
    (BOLT12 offers were saved but the response failed to serialize)
  - Fix: the container could refuse to start when lnd.conf wrote the BOLT12
    flags with spaces around "=" — flag detection now handles both forms
  - Fix: LNDK macaroon path — the server now passes LND's macaroon to LNDK
    (which LNDK forwards to LND), so offer/pay/decode calls authenticate
  - Hardening: malformed API keys return 401 cleanly; amount 0 means a
    free (payer-chooses) offer
  - Manual SSH deploy now uses a self-contained compose file


  v2.2.1 — Production readiness & BOLT12 peer detection

  Production-readiness improvements:
  - Docker images are now pinned to an explicit version tag (2.2.1) instead of
    floating latest, so Umbrel pulls updates reliably
  - New pre-start checks run inside the container and print clear warnings if
    LND flags, public channels, or BOLT12-capable peers are missing
  - setup-lnd-flags.sh now automatically escalates to sudo when UmbrelOS 1.x
    settings.json is owned by root, and creates a timestamped backup
  - Diagnostic endpoint now reports how many connected peers support BOLT12
    onion messages

  Dashboard improvements:
  - Diagnostic tab warns when no connected peer supports BOLT12 onion messaging
  - Clearer guidance on opening a public channel to a BOLT12-compatible peer

  Remaining manual prerequisites:
  - Run setup-lnd-flags.sh once before install
  - Ensure LND has at least one public channel to a BOLT12-compatible peer
    (e.g. ACINQ) so invoice requests can be relayed to your node
