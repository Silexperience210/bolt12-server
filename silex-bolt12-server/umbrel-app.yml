manifestVersion: 1.1
id: silex-bolt12-server
category: bitcoin
name: Bolt12 Server
version: "2.1.0"
tagline: BOLT12 offers + Lightning Address — LNDK bundled, zero config
icon: https://raw.githubusercontent.com/Silexperience210/bolt12-server/main/silex-bolt12-server/icon.svg
description: >-
  Self-hosted BOLT12 Lightning server for your Umbrel node.
  Create offers, receive payments, track history — LNDK is bundled automatically,
  no separate installation required.


  ── FEATURES ──

  ⚡ BOLT12 Offers — Create reusable payment offers with optional fixed amounts

  💸 Pay & Decode — Pay BOLT12 offers and decode invoices directly from the dashboard

  📊 14-Day Stats — Visual chart of sent/received activity over the last 2 weeks

  📋 Payment History — Full log of sent and received payments with CSV export

  🔗 Shareable Pay Links — Each offer has a public pay page with QR code

  🌐 Lightning Address — Optional: set your domain to enable pay@yourdomain.com (LNURL-pay)

  🔔 Webhooks — HTTP callbacks on payment events (payment_sent, invoice_created)

  🧾 Templates — Save reusable offer presets for quick generation

  🔑 Auto API Key — Generated on first start, accessible on local network only

  🛡 Security-hardened — CSP, X-Frame-Options, atomic file writes, SSRF protection


  ── PREREQUISITE (one time only) ──

  Before installing, your LND node needs 3 protocol flags for onion messaging (BOLT12).
  Run this single command via SSH on your Umbrel node:

  bash <(curl -s https://raw.githubusercontent.com/Silexperience210/bolt12-server/main/setup-lnd-flags.sh)

  This safely adds the flags to lnd.conf and restarts LND (~30s).
  After that, install this app — everything else is fully automatic.


  ── LIGHTNING ADDRESS (optional) ──

  To enable pay@yourdomain.com, set LNURL_DOMAIN in the app's environment
  after installation. Requires a publicly accessible domain with HTTPS.

