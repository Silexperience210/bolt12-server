releaseNotes: >-
  v2.1.0 — Major hardening + Lightning Address support

  New features:
  - Lightning Address / LNURL-pay (optional, set LNURL_DOMAIN to activate)
  - LNDK version pinned to v0.3.0 (stable, no surprise breakages from updates)
  - LNDK now waits for LND before starting (no more failed boot races)
  - LNDK healthcheck built into Docker Compose

  Security improvements:
  - Full CSP + security headers on all responses
  - Atomic JSON file writes (no corruption on power loss)
  - SSRF protection on webhook URLs
  - API key moved to sessionStorage (clears on tab close)
  - JS libraries self-hosted at build time (no CDN at runtime)
  - BigInt validation on all Lightning amounts
