syntax = "proto3";

package lnrpc;

option go_package = "github.com/lightningnetwork/lnd/lnrpc";

// Lightning service - Bolt12 Offer API
service Lightning {
  // GetInfo returns general node info
  rpc GetInfo (GetInfoRequest) returns (GetInfoResponse);

  // CreateOffer creates a new Bolt12 reusable offer
  rpc CreateOffer (OfferRequest) returns (OfferResponse);

  // ListOffers lists active offers, optionally filtered by ID
  rpc ListOffers (ListOffersRequest) returns (ListOffersResponse);

  // DisableOffer disables/cancels an existing offer
  rpc DisableOffer (DisableOfferRequest) returns (DisableOfferResponse);
}

// GetInfo
message GetInfoRequest {}

message GetInfoResponse {
  string version    = 1;
  string alias      = 2;
  repeated Chain chains = 16;
  repeated string uris  = 17;
}

message Chain {
  string chain   = 1;
  string network = 2;
}

// CreateOffer
message OfferRequest {
  // amount in sats, "0" means any amount
  string amount      = 1;
  string description = 2;
  // optional expiry in seconds
  int64  expiry      = 3;
}

message OfferResponse {
  // unique offer identifier
  string id    = 1;
  // lno1... bolt12 offer string
  string offer = 2;
}

// ListOffers
message ListOffersRequest {
  // optional: filter by offer ID
  string id = 1;
}

message ListOffersResponse {
  repeated Offer offers = 1;
}

message Offer {
  string id          = 1;
  string offer       = 2;
  string description = 3;
  bool   active      = 4;
  string amount      = 5;
}

// DisableOffer
message DisableOfferRequest {
  string id = 1;
}

message DisableOfferResponse {
  bool   updated = 1;
  string message = 2;
}
